<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeevo Tours - Custom CRM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-400 text-indigo-950 p-2 rounded-lg font-bold text-xl tracking-wider">JT</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Jeevo Tours CRM</h1>
                    <p class="text-xs text-indigo-200">Lead & Enquiry Dashboard</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openNewLeadModal()" class="bg-amber-400 hover:bg-amber-500 text-indigo-950 px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center shadow-sm">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Test Lead
                </button>
                <button onclick="loadLeads()" class="bg-indigo-800 hover:bg-indigo-700 text-white p-2 rounded-lg transition" title="Refresh Leads">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Stats Section -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Enquiries</p>
                    <h3 id="stat-total" class="text-3xl font-extrabold text-slate-900 mt-1">0</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">New Leads</p>
                    <h3 id="stat-new" class="text-3xl font-extrabold text-blue-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Booked Deals</p>
                    <h3 id="stat-booked" class="text-3xl font-extrabold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
            </div>
        </section>

        <!-- Filters & Search Bar -->
        <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider mr-2">Filter:</span>
                <button onclick="setFilter('All')" id="filter-All" class="filter-btn bg-indigo-900 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">All</button>
                <button onclick="setFilter('New Lead')" id="filter-New Lead" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">New Lead</button>
                <button onclick="setFilter('Contacted')" id="filter-Contacted" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">Contacted</button>
                <button onclick="setFilter('Itinerary Sent')" id="filter-Itinerary Sent" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">Itinerary Sent</button>
                <button onclick="setFilter('Booked')" id="filter-Booked" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">Booked</button>
                <button onclick="setFilter('Lost')" id="filter-Lost" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">Lost</button>
            </div>

            <div class="w-full md:w-64 relative">
                <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Search leads..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </section>

        <!-- Leads Table Section -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/75 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
                            <th class="py-3.5 px-4">Date</th>
                            <th class="py-3.5 px-4">Client Name</th>
                            <th class="py-3.5 px-4">Contact Info</th>
                            <th class="py-3.5 px-4">Destination & Budget</th>
                            <th class="py-3.5 px-4">Travel Dates</th>
                            <th class="py-3.5 px-4">Status</th>
                            <th class="py-3.5 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table-body" class="divide-y divide-slate-200 text-sm">
                        <!-- Dynamic Rows Injected Here -->
                        <tr>
                            <td colspan="7" class="py-8 text-center text-slate-400">Loading leads...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal for Edit Lead / Notes -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full overflow-hidden border border-slate-200">
            <div class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-lg" id="modal-title">Update Lead</h3>
                <button onclick="closeEditModal()" class="text-indigo-200 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="modal-lead-id">

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Status</label>
                    <select id="modal-status" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="New Lead">New Lead</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Itinerary Sent">Itinerary Sent</option>
                        <option value="Booked">Booked</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Internal Notes</label>
                    <textarea id="modal-notes" rows="4" placeholder="Add quotes, trip details, or call logs here..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button onclick="closeEditModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-100 font-medium">Cancel</button>
                    <button onclick="saveLeadChanges()" class="px-4 py-2 bg-indigo-900 hover:bg-indigo-800 text-white rounded-lg text-sm font-semibold">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for New Test Lead -->
    <div id="new-lead-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full overflow-hidden border border-slate-200">
            <div class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-lg">Add New Lead Enquire</h3>
                <button onclick="closeNewLeadModal()" class="text-indigo-200 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <form onsubmit="submitNewLead(event)" class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Full Name *</label>
                        <input type="text" id="new-name" required placeholder="e.g. Rahul Sharma" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email *</label>
                        <input type="email" id="new-email" required placeholder="rahul@example.com" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Phone *</label>
                        <input type="tel" id="new-phone" required placeholder="+91 9876543210" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Destination</label>
                        <input type="text" id="new-destination" placeholder="e.g. Bali, Indonesia" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Budget</label>
                        <input type="text" id="new-budget" placeholder="e.g. ₹1.5 Lakhs" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Travel Dates</label>
                        <input type="text" id="new-travel-dates" placeholder="e.g. 15 Oct - 22 Oct 2026" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Notes / Preferences</label>
                        <textarea id="new-notes" rows="2" placeholder="Honeymoon package, 4-star hotel..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeNewLeadModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-100 font-medium">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-amber-400 hover:bg-amber-500 text-indigo-950 rounded-lg text-sm font-semibold">Add Lead</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let allLeads = [];
        let currentFilter = 'All';

        // Helper for status badge styling
        function getStatusBadgeClass(status) {
            switch(status) {
                case 'New Lead':
                    return 'bg-blue-100 text-blue-800 border-blue-200';
                case 'Contacted':
                    return 'bg-amber-100 text-amber-800 border-amber-200';
                case 'Itinerary Sent':
                    return 'bg-purple-100 text-purple-800 border-purple-200';
                case 'Booked':
                    return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case 'Lost':
                    return 'bg-red-100 text-red-800 border-red-200';
                default:
                    return 'bg-slate-100 text-slate-800 border-slate-200';
            }
        }

        // Fetch leads from FastAPI
        async function loadLeads() {
            try {
                const response = await fetch('/api/crm/leads');
                if (!response.ok) throw new Error('Failed to load leads');
                allLeads = await response.json();
                updateStats();
                renderLeadsTable();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('leads-table-body').innerHTML = `
                    <tr>
                        <td colspan="7" class="py-8 text-center text-red-500">
                            Failed to fetch leads. Make sure the FastAPI server is running.
                        </td>
                    </tr>
                `;
            }
        }

        // Update dashboard KPI cards
        function updateStats() {
            document.getElementById('stat-total').innerText = allLeads.length;
            const newCount = allLeads.filter(l => l.status === 'New Lead').length;
            const bookedCount = allLeads.filter(l => l.status === 'Booked').length;
            document.getElementById('stat-new').innerText = newCount;
            document.getElementById('stat-booked').innerText = bookedCount;
        }

        // Render leads table according to filter & search
        function renderLeadsTable() {
            const tbody = document.getElementById('leads-table-body');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            let filtered = allLeads.filter(lead => {
                const matchesFilter = (currentFilter === 'All') || (lead.status === currentFilter);
                const matchesSearch =
                    lead.name.toLowerCase().includes(searchVal) ||
                    lead.email.toLowerCase().includes(searchVal) ||
                    lead.phone.toLowerCase().includes(searchVal) ||
                    (lead.destination && lead.destination.toLowerCase().includes(searchVal));
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="py-8 text-center text-slate-400">
                            No leads found matching criteria.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(lead => {
                const formattedDate = new Date(lead.created_at).toLocaleDateString('en-IN', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });

                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3.5 px-4 text-xs text-slate-500 font-medium">${formattedDate}</td>
                        <td class="py-3.5 px-4 font-semibold text-slate-900">${escapeHtml(lead.name)}</td>
                        <td class="py-3.5 px-4">
                            <div class="text-xs text-slate-700">${escapeHtml(lead.email)}</div>
                            <div class="text-xs text-slate-500">${escapeHtml(lead.phone)}</div>
                        </td>
                        <td class="py-3.5 px-4">
                            <div class="font-medium text-slate-800">${escapeHtml(lead.destination || 'N/A')}</div>
                            <div class="text-xs text-slate-500">${escapeHtml(lead.budget || '')}</div>
                        </td>
                        <td class="py-3.5 px-4 text-xs text-slate-600">${escapeHtml(lead.travel_dates || 'Flexible')}</td>
                        <td class="py-3.5 px-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${getStatusBadgeClass(lead.status)}">
                                ${lead.status}
                            </span>
                        </td>
                        <td class="py-3.5 px-4 text-right space-x-2">
                            <button onclick="openEditModal(${lead.id})" class="text-indigo-600 hover:text-indigo-900 font-medium text-xs bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded transition">
                                Edit
                            </button>
                            <button onclick="deleteLead(${lead.id})" class="text-red-600 hover:text-red-800 font-medium text-xs bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded transition">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Set status filter
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition';
            });
            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) {
                activeBtn.className = 'filter-btn bg-indigo-900 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition';
            }
            renderLeadsTable();
        }

        function filterTable() {
            renderLeadsTable();
        }

        // Modal Handlers
        function openEditModal(leadId) {
            const lead = allLeads.find(l => l.id === leadId);
            if (!lead) return;

            document.getElementById('modal-lead-id').value = lead.id;
            document.getElementById('modal-status').value = lead.status;
            document.getElementById('modal-notes').value = lead.notes || '';
            document.getElementById('modal-title').innerText = `Update: ${lead.name}`;

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function saveLeadChanges() {
            const leadId = document.getElementById('modal-lead-id').value;
            const newStatus = document.getElementById('modal-status').value;
            const newNotes = document.getElementById('modal-notes').value;

            try {
                const response = await fetch(`/api/crm/leads/${leadId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus, notes: newNotes })
                });

                if (!response.ok) throw new Error('Failed to update lead');

                closeEditModal();
                await loadLeads();
            } catch (err) {
                alert('Error updating lead: ' + err.message);
            }
        }

        async function deleteLead(leadId) {
            if (!confirm('Are you sure you want to delete this lead?')) return;

            try {
                const response = await fetch(`/api/crm/leads/${leadId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete lead');

                await loadLeads();
            } catch (err) {
                alert('Error deleting lead: ' + err.message);
            }
        }

        function openNewLeadModal() {
            document.getElementById('new-lead-modal').classList.remove('hidden');
        }

        function closeNewLeadModal() {
            document.getElementById('new-lead-modal').classList.add('hidden');
        }

        async function submitNewLead(event) {
            event.preventDefault();

            const payload = {
                name: document.getElementById('new-name').value,
                email: document.getElementById('new-email').value,
                phone: document.getElementById('new-phone').value,
                destination: document.getElementById('new-destination').value,
                budget: document.getElementById('new-budget').value,
                travel_dates: document.getElementById('new-travel-dates').value,
                notes: document.getElementById('new-notes').value
            };

            try {
                const response = await fetch('/api/enquiries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Failed to create lead');

                closeNewLeadModal();
                event.target.reset();
                await loadLeads();
            } catch (err) {
                alert('Error submitting enquiry: ' + err.message);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize dashboard on load
        window.addEventListener('DOMContentLoaded', loadLeads);
    </script>
</body>
</html>
